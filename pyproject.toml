[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-unfaithfulness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    # spaCy model for the TF-IDF probe (src/lib/text_features.py), pinned to the spaCy minor.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "joblib",
    "matplotlib>=3.10.8",
    "numba>=0.61.2",
    "openai",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "scikit-learn>=1.5",
    "scipy",
    "spacy>=3.8,<4",
    "torch",
    # <5.15 is required: vLLM cannot load Gemma 4 under transformers 5.15's per_layer_config.
    "transformers>=5.14.1,<5.15",
    "vllm>=0.19.0",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
