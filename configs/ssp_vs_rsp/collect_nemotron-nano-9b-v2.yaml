# SSP-vs-RSP probe comparison (src/lib/ssp_vs_rsp.py): residual stream of the ORIGINAL rollouts of the
# nemotron-nano-9b-v2 universe (build_universe.py) at the one layer the attention and per-prefix linear probes read.
#   DATA_ROOT=/workspace/data .venv/bin/python -m src.scripts.collect_probe_activations --config configs/ssp_vs_rsp/collect_nemotron-nano-9b-v2.yaml
extends: ../nemotron_nano-9b_base.yaml
dataset: "${DATA_ROOT}/ssp_vs_rsp/probe_datasets/nemotron-nano-9b-v2_ssp_rsp_universe.parquet"
store_folder: nemotron-nano-9b-v2_ssp_rsp
storage:
  backend: local
  local_dir: "${DATA_ROOT}/ssp_vs_rsp/activations"
layers: [31]
seq_layers: [31]
max_file_gb: 8
hf_model_kwargs: {}
upload_workers: 3
staging: memory
