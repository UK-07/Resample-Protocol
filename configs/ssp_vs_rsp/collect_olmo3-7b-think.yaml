# SSP-vs-RSP probe comparison (src/lib/ssp_vs_rsp.py): residual stream of the ORIGINAL rollouts of the
# olmo3-7b-think universe (build_universe.py) at the one layer the attention and per-prefix linear probes read.
#   DATA_ROOT=/workspace/data .venv/bin/python -m src.scripts.collect_probe_activations --config configs/ssp_vs_rsp/collect_olmo3-7b-think.yaml
extends: ../olmo_3-7b-think_base.yaml
dataset: "${DATA_ROOT}/ssp_vs_rsp/probe_datasets/olmo3-7b-think_ssp_rsp_universe.parquet"
store_folder: olmo3-7b-think_ssp_rsp
storage:
  backend: local
  local_dir: "${DATA_ROOT}/ssp_vs_rsp/activations"
layers: [18]
seq_layers: [18]
max_file_gb: 8
hf_model_kwargs: {}
upload_workers: 2
staging: memory
