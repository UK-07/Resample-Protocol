# SSP-vs-RSP probe comparison (src/lib/ssp_vs_rsp.py): residual stream of the ORIGINAL rollouts of the
# qwen3-8b universe (build_universe.py) at the one layer the attention and per-prefix linear probes read.
#   DATA_ROOT=/workspace/data .venv/bin/python -m src.scripts.collect_probe_activations --config configs/ssp_vs_rsp/collect_qwen3-8b.yaml
extends: ../qwen_3-8b_base.yaml
dataset: "${DATA_ROOT}/ssp_vs_rsp/probe_datasets/qwen3-8b_ssp_rsp_universe.parquet"
store_folder: qwen3-8b_ssp_rsp
storage:
  backend: local
  local_dir: "${DATA_ROOT}/ssp_vs_rsp/activations"
layers: [20]
seq_layers: [20]
max_file_gb: 8
hf_model_kwargs: {}
upload_workers: 6
staging: memory
