# Linear probes on the four probe points (pre_cot, last_cot, pre_answer,
# mean_cot) per layer, leave-one-hint-out, for Qwen3-8B.
#   uv run python -m src.scripts.train_probe --config configs/probes/qwen3-8b_linear.yaml --dry-run
#   uv run python -m src.scripts.train_probe --config configs/probes/qwen3-8b_linear.yaml
extends: qwen3-8b_probe_local.yaml   # model (the local mirror of the shared store), dataloader, output.dir

# The linear probes read the POINTS files only (points_layer_<L>_partNN, one
# [4, hidden] tensor per rollout): the store holds them for every one of its
# 7 layers (`layers` of the collector config, ≈ 12 GB in total) and the
# mirror copies them all (`mirror_probe_store.py` without `--layers`), so
# every layer is probed — no seq file is needed.
model:
  layers: [10, 15, 17, 20, 23, 25, 30]

dataset:
  path: ${DATA_ROOT}/probe_datasets/qwen3-8b_verbalised_vs_unverbalised.parquet
  folds: null
  cases: both

probe:
  type: linear
  points: [pre_cot, last_cot, pre_answer, mean_cot]   # one unit per layer × point
  standardize: true

# One residual vector per row: a fold's rows are materialised once (rows ×
# points × layers × hidden × 2 B), so the batches are plain row slices and
# max_batch_tokens does not apply.
training:
  epochs: 20
  batch_size: 256
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  patience: 5
  class_weighting: balanced
  seed: 42

# 2 × 2 = 4 trials.
search:
  lr: [0.001, 0.01]
  weight_decay: [0.001, 0.01]

output:
  run_name: qwen3-8b_linear
