# Per-model base of the probe-training configs (src/scripts/train_probe.py)
# over the LOCAL MIRROR of the shared activation store — what every training
# run on the pod reads. `nemotron_linear.yaml` / `nemotron_attention.yaml`
# `extends:` this file; `nemotron_probe_base.yaml` is the same block over the
# Hub (the collector-side identity of the store — kept for a dry run against
# the source, never for a training run: the shared store is ≈ 5.6 TB, the
# linear probes would issue ~1.5 M Range requests per fold and the attention
# probe cannot stream ~800 GB per layer per epoch at 50-140 MB/s).
#
# The mirror is written by
#     uv run python -m src.scripts.mirror_probe_store \
#         --config configs/collect_probe_activations_nemotron.yaml \
#         --dest /root/probe_activations_mirror --layers 31
# (points of every layer ≈ 12 GB, plus ≈ 800 GB of seq files per mirrored
# layer). `local_dir` is a POD-LOCAL path on purpose, not `${DATA_ROOT}`: the
# shared volume is a network drive with ~150 GB free, the mirror is a
# multi-hundred-GB copy that must sit on the pod's own container disk (NVMe)
# — never on the shared drive — and is thrown away with the pod.
#
# `model:` is FORBIDDEN for the TF-IDF probe (it reads no activations): the
# tfidf config sets `model: null`, which load_config's merge replaces wholesale.
# Inheritance is one level (load_config), so this file repeats the base's
# blocks instead of extending it.

model:
  subject_model: nemotron-nano-9b-v2
  # A make_backend block (src/lib/activation_store.py) plus `folder`: the store
  # folder under `local_dir` — the mirror of the SHARED store
  # `nemotron-nano-9b-v2_shared` (collect_probe_activations_nemotron.yaml's
  # `store_folder`). The trainer requires every fold id to be in the store,
  # not the same dataset fingerprint. The HF keys are null for backend: local.
  activations:
    backend: local
    local_dir: /root/probe_activations_mirror
    hf_repo_id: null
    revision: null
    folder: nemotron-nano-9b-v2_shared
  # Layers to probe: must be a subset of what the MIRROR holds for the file
  # kind the probe reads — the meta's `mirrored_points_layers` for the linear
  # probe (every stored layer when the points were mirrored), `mirrored_layers`
  # for the attention probe (the `--layers` given to the mirror). A layer the
  # mirror lacks is refused naming the mirror run that adds it. Each probe
  # config sets its own list; this default is the linear probe's.
  layers: [15, 23, 27, 31, 35, 39, 47]

# The sequence adapter's DataLoader (attention probe only): every worker reads
# its own sample from the mmap'd local files, `fetch_threads` layers at a time.
# Host RAM ≈ (num_workers × prefetch_factor + 1) × max_batch_tokens × layers ×
# hidden × 2 B — ~10 GB for one layer of the 9B store at 65 536 tokens;
# `--dry-run` prints the estimate next to the container's cgroup limit.
dataloader:
  num_workers: 8
  fetch_threads: 4
  prefetch_factor: 2

output:
  dir: ${DATA_ROOT}/trained_probes/probes
